{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finance Manager{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }
        .top-bar {
            background-color: #9b46e5;
            padding: 18px 24px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .nav-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-links {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }
        .separator {
            color: white;
        }
        .logout-link {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }
        .main-content {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        @media (max-width: 900px) {
            .nav-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="top-bar">
        <div class="nav-container">
            <nav class="nav-links">
                <a href="{% url 'categories-page' %}" class="nav-link">Categories</a>
                <span class="separator">•</span>
                <a href="{% url 'expenses-page' %}" class="nav-link">Expense Management</a>
                <span class="separator">•</span>
                <a href="{% url 'incomes-page' %}" class="nav-link">Income Management</a>
                <span class="separator">•</span>
                <a href="{% url 'monthly-expenses-page' %}" class="nav-link">Monthly Expenses</a>
                <span class="separator">•</span>
                <a href="{% url 'monthly-incomes-page' %}" class="nav-link">Monthly Incomes</a>
                <span class="separator">•</span>
                <a href="#" class="nav-link">Total Income vs Expenses</a>
            </nav>
            <a href="#" class="logout-link">Log out</a>
        </div>
    </header>
    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
